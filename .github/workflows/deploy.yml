name: Deploy to gh-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Push dist to gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git add -A
          git -c commit.gpgsign=false -c user.email="github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -qm "deploy: update GitHub Pages site from master"
          git push -q --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages
